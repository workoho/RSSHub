name: 'Docker Custom Build'

on:
    push:
        branches:
            - master
        paths:
            - '.github/workflows/docker-custom.yml'
            - 'lib/**'
            - '!lib/**/*.test.ts'
            - 'Dockerfile'
    workflow_dispatch: {}

# Queue builds per ref so an older build cannot push latest after a newer one
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            packages: write
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to the Container registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=raw,value={{date 'YYYY-MM-DD'}},enable={{is_default_branch}}
                      type=sha,format=long,prefix=,enable=true
                  flavor: latest=false

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=docker-custom
                  cache-to: type=gha,mode=max,scope=docker-custom

            - name: Trigger Coolify redeployment
              if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
              # UNVERIFIED (Coolify API docs): GET /api/v1/deploy?uuid=<uuid>&force=true
              # needs "Authorization: Bearer <token>" with deploy permission.
              # -G appends force=true after "?" or "&", whichever the URL needs.
              env:
                  COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
                  COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
              run: |
                  if [ -z "$COOLIFY_API_TOKEN" ]; then
                    echo "::error::Secret COOLIFY_API_TOKEN is not set: create a Coolify API token with deploy permission and add it as an Actions secret."
                    exit 1
                  fi
                  curl --silent --fail --show-error -G \
                    -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
                    --data-urlencode force=true \
                    "$COOLIFY_WEBHOOK_URL"
