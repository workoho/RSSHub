services:
    rsshub:
        image: ghcr.io/workoho/rsshub:latest
        restart: always
        expose:
            - '1200'
        environment:
            NODE_ENV: production
            CACHE_TYPE: redis
            REDIS_URL: 'redis://redis:6379/'
            # Endpoint format from upstream's docker-compose.yml (PLAYWRIGHT_CDP_ENDPOINT, read by lib/utils/playwright.ts). Needs the synced code from workoho/RSSHub#78.
            # UNVERIFIED: ${BROWSERLESS_TOKEN:?} replaces upstream's default value; Coolify's handling of :? is from its docs, not a run.
            PLAYWRIGHT_CDP_ENDPOINT: 'ws://browserless:3000?token=${BROWSERLESS_TOKEN:?}'
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:1200/healthz']
            interval: 30s
            timeout: 10s
            retries: 3
        depends_on:
            - redis
            - browserless
        labels:
            # RSSHUB_BASIC_AUTH is set in Coolify as user:bcrypt-hash (htpasswd -nbB); a deploy is blocked while it is empty.
            # Unverified: if the right password gets 401, Compose may have expanded the $ signs; enter the hash with every $ doubled.
            - traefik.http.middlewares.hyprrykhpm87vx88mwnlwrkt-rsshub.basicauth.users=${RSSHUB_BASIC_AUTH:?}
            - traefik.http.routers.http-0-hyprrykhpm87vx88mwnlwrkt-rsshub.middlewares=hyprrykhpm87vx88mwnlwrkt-rsshub

    browserless:
        # UNVERIFIED: the v2.57.3 tag exists on GHCR (checked via the registry API); no run on this image yet. Upstream leaves the tag unpinned.
        image: ghcr.io/browserless/chromium:v2.57.3
        restart: always
        environment:
            TOKEN: '${BROWSERLESS_TOKEN:?}'
        ulimits:
            core:
                hard: 0
                soft: 0
        healthcheck:
            test: ['CMD-SHELL', 'curl -f "http://localhost:3000/pressure?token=$$TOKEN"']
            interval: 30s
            timeout: 10s
            retries: 3

    redis:
        image: redis:alpine
        restart: always
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 5s

volumes:
    redis-data:
