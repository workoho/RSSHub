services:
    rsshub:
        image: ghcr.io/workoho/rsshub:latest
        restart: always
        expose:
            - '1200'
        environment:
            NODE_ENV: production
            CACHE_TYPE: redis
            REDIS_URL: 'redis://redis:6379/'
            PUPPETEER_WS_ENDPOINT: 'ws://browserless:3000'
            PUPPETEER_REAL_BROWSER_SERVICE: 'http://real-browser:3000'
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:1200/healthz']
            interval: 30s
            timeout: 10s
            retries: 3
        depends_on:
            - redis
            - browserless
        labels:
            # Basic Auth reads its users from an htpasswd file on the server, not from a label value:
            # Coolify does not interpolate variables in labels, so a ${...} reference reaches Traefik literally.
            # The file is /data/coolify/proxy/rsshub.htpasswd on the server, mounted into the Coolify proxy as /traefik.
            # Create or update it with: htpasswd -nbB -C 12 <user> <password>
            - traefik.http.middlewares.hyprrykhpm87vx88mwnlwrkt-rsshub.basicauth.usersfile=/traefik/rsshub.htpasswd
            # Coolify generates an http-0 and, for an https domain, an https-0 router; both get the middleware.
            - traefik.http.routers.http-0-hyprrykhpm87vx88mwnlwrkt-rsshub.middlewares=hyprrykhpm87vx88mwnlwrkt-rsshub
            - traefik.http.routers.https-0-hyprrykhpm87vx88mwnlwrkt-rsshub.middlewares=hyprrykhpm87vx88mwnlwrkt-rsshub

    real-browser:
        image: ghcr.io/hyoban/puppeteer-real-browser-hono
        restart: always
        expose:
            - '3000'
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3000']
            interval: 30s
            timeout: 10s
            retries: 3

    browserless:
        image: browserless/chrome
        restart: always
        ulimits:
            core:
                hard: 0
                soft: 0
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3000/pressure']
            interval: 30s
            timeout: 10s
            retries: 3

    redis:
        image: redis:alpine
        restart: always
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 5s

volumes:
    redis-data:
